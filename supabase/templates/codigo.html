<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f3f4f6;font-family:Inter,Segoe UI,Arial,sans-serif;color:#111418">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:18px;padding:28px">
          <tr><td>
            <p style="margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.08em;color:#5b616b">SR CONECTA</p>
            <h1 style="margin:0 0 16px;font-size:24px">Tu código para entrar</h1>
            <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#5b616b">Escribe este código en la aplicación:</p>
            <p style="margin:0 0 24px;font-size:36px;font-weight:800;letter-spacing:.18em;text-align:center;background:#eaf1ff;color:#1d4ed8;border-radius:14px;padding:16px">{{ .Token }}</p>
            <p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#5b616b">O toca este botón desde este mismo teléfono:</p>
            <p style="margin:0 0 24px;text-align:center"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111418;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:14px">Entrar a SR Conecta</a></p>
            <p style="margin:0;font-size:13px;line-height:1.5;color:#8a9099">El código vence en una hora. Si no pediste entrar, ignora este correo: nadie puede entrar sin él.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
