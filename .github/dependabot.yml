# Actualizaciones de dependencias (SECURITY.md). Las de seguridad llegan en cuanto hay aviso;
# las demás, agrupadas una vez por semana para no llenar el repositorio de PR.
# Hasta el 27/10 el código está congelado: los PR que no sean de seguridad se revisan después de la demo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Las versiones mayores (TypeScript 7, ESLint 10…) cambian APIs: se planean a mano, no llegan solas.
    # Las alertas de seguridad siguen apareciendo en Security → Dependabot; si una corrección exige versión mayor, se hace a mano.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
